# Copy this file and replace paths for your run.
ref: "data/reference.fasta"
samples_tsv: "config/samples_examples.tsv"
outdir: "results"

fastp_threads: 8
fastp_mem_mb: 4000
fastp_min_len: 36
fastp_cut_front: true
fastp_cut_tail: true
fastp_cut_mean_quality: 15

bwa_threads: 8
bwa_mem_mb: 12000
markdup_threads: 8
markdup_mem_mb: 16000
call_bam_threads: 8
call_bam_mem_mb: 4000
hc_threads: 1
hc_mem_mb: 16000
genomicsdb_mem_mb: 16000
genotype_mem_mb: 16000
select_mem_mb: 4000
filter_mem_mb: 4000
merge_threads: 2
merge_mem_mb: 4000

gatk:
  sample_ploidy: 2
  min_base_qual: 20
  dont_use_soft_clipped: true

call_bam:
  require_proper_pair: true  # applied only to paired-end samples
  exclude_flags: 3844
  mapq: 30

joint:
  chunk_size: null
  reader_threads: 4
  batch_size: 50
  consolidate: true
  tmp_dir: tmp

filters:
  snp: 'QD < 5.0 || FS > 30.0 || MQ < 50.0 || MQRankSum < -8.0 || ReadPosRankSum < -5.0 || SOR > 2.0'
  indel: 'QD < 5.0 || FS > 200.0 || ReadPosRankSum < -10.0 || SOR > 10.0'

ad_filter:
  enabled: false
  min_dp: 5
  ambig_low: 0.1
  ambig_high: 0.9
  split_multiallelic: false
  drop_hets: false

final:
  sample_max_missing: 0.2  # maximum missing fraction allowed per sample
  max_missing: 0.5  # minimum non-missing fraction required per site

gvcf_reuse:
  enabled: true
  validation_threads: 8
  include_existing_samples: true   # reuse all existing GVCFs in outdir/gvcf
  # Strict default: legacy GVCFs are reused only when their ##reference path is
  # accessible and has the same SHA-256 as ref. Set true once only after
  # independently confirming legacy GVCFs used the identical reference.
  allow_legacy_header_match: false
