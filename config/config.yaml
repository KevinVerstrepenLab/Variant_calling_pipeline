# One configuration for variant calling and downstream population analyses.
# Run from the repository root. Relative paths resolve from that directory.

# 1. Project and inputs --------------------------------------------------------
project:
  outdir: results
inputs:
  reference: data/reference.fasta
  samples_tsv: config/samples_examples.tsv
  # For discovery, set samples_tsv: null and fastq_dir/read_layout below.
  # fastq_dir: data/reads
  # read_layout: paired
  # single_end_pattern: "*.fastq.gz"

# 2. Compute resources (threads per job, memory in MB) --------------------------
resources:
  fastp:          {threads: 8, mem_mb: 4000}
  bwa:            {threads: 8, mem_mb: 12000}
  markdup:        {threads: 8, mem_mb: 16000}
  call_bam:       {threads: 8, mem_mb: 4000}
  hc:             {threads: 1, mem_mb: 16000}
  genomicsdb:     {mem_mb: 16000}
  genotype:       {mem_mb: 16000}
  select:         {mem_mb: 4000}
  filter:         {mem_mb: 4000}
  merge:          {threads: 2, mem_mb: 4000}
  postprocessing: {threads: 8, mem_mb: 16000}
  coverage_plots: {threads: 4, mem_mb: 4000}

# 3. Read processing ----------------------------------------------------------
read_processing:
  fastp:
    min_len: 36
    cut_front: true
    cut_tail: true
    cut_mean_quality: 15
  call_bam:
    require_proper_pair: true  # applied only to paired-end samples
    exclude_flags: 3844
    mapq: 30

# 4. Variant calling and cohort reuse -----------------------------------------
variant_calling:
  gatk:
    sample_ploidy: 2
    min_base_qual: 20
    dont_use_soft_clipped: true
  joint:
    chunk_size: null
    reader_threads: 4
    batch_size: 50
    consolidate: true
    tmp_dir: tmp
  gvcf_reuse:
    enabled: true
    validation_threads: 8
    include_existing_samples: true
    # Enable only after independently confirming identical reference sequences.
    allow_legacy_header_match: false

# 5. Variant and genotype filtering -------------------------------------------
filtering:
  hard:
    # Keep decimal thresholds for floating-point INFO fields, including scientific notation.
    # Guard each annotation so a missing field does not bypass other OR conditions.
    snp: >-
      (vc.hasAttribute("QD") && QD < 5.0) ||
      (vc.hasAttribute("FS") && FS > 30.0) ||
      (vc.hasAttribute("MQ") && MQ < 50.0) ||
      (vc.hasAttribute("MQRankSum") && MQRankSum < -8.0) ||
      (vc.hasAttribute("ReadPosRankSum") && ReadPosRankSum < -5.0) ||
      (vc.hasAttribute("SOR") && SOR > 2.0)
    indel: >-
      (vc.hasAttribute("QD") && QD < 5.0) ||
      (vc.hasAttribute("FS") && FS > 200.0) ||
      (vc.hasAttribute("ReadPosRankSum") && ReadPosRankSum < -10.0) ||
      (vc.hasAttribute("SOR") && SOR > 10.0)
  genotypes:
    enabled: false
    min_dp: 5
    ambig_low: 0.1
    ambig_high: 0.9
    split_multiallelic: false
    drop_hets: false
  final:
    sample_max_missing: 0.20 # maximum missing fraction allowed per sample
    max_missing: 0.50        # minimum NON-MISSING fraction required per site

# 6. Population analyses of final/filtered_snps.final.vcf.gz -------------------
# No extra dataset/input VCF config is needed. Final filtering above already
# keeps PASS/. variants and removes samples with excessive missingness.
postprocessing:
  enabled: false             # true includes these analyses in rule all
  prefix: cohort
  force: false               # true reruns internal steps when scheduled
  metadata:
    rename: null             # old_sample_id<TAB>new_label (no header)
    clades: null             # sample_or_label<TAB>clade (optional header)
    clade_colors: null       # clade<TAB>#RRGGBB (optional header)
  # Shared variant selection for PCA and the phylogenetic tree -----------------
  variant_selection:
    maf: 0.01
    geno: 0.10               # maximum missing fraction allowed per variant
    snps_only: true
    biallelic: true
    keep: null               # optional PLINK sample keep file
    ld_prune: {enabled: true, window: 50, step: 5, r2: 0.2}

  # ==========================================================================
  # 6.1 PCA — principal component analysis
  # ==========================================================================
  pca:
    enabled: true
    sample_list: null        # optional file: one sample ID/renamed label per line; plot only
    components: 20
    label_points: false
    label_size: 2.0

  # ==========================================================================
  # 6.2 TREE — phylogenetic tree analysis
  # ==========================================================================
  phylogenetic_tree:
    enabled: true
    sample_list: null        # optional file: one sample ID/renamed label per line; plot only
    method: nj               # nj or upgma; distances are 1-IBS
    outgroup: null           # sample label after renaming
    layout: fan              # fan, rectangular, circular, daylight, equal_angle...
    branch_length: true
    label_tips: false
    label_size: 2.0
    tip_size: 1.2
    color_branches: true
    color_tip_labels: true
    width: 18
    height: 18
    dpi: 300

  # ==========================================================================
  # 6.3 STRUCTURE — LEA / sNMF population structure analysis
  # ==========================================================================
  lea:
    enabled: true
    maf: 0.05
    max_missing: 0.90        # minimum NON-MISSING fraction required per variant
    ld_prune: {window: 50, step: 5, r2: 0.2}
    run_snmf: true           # false prepares pruned VCF and PED/MAP only
    k_min: 2
    k_max: 20
    repetitions: 5
    seed: 12345
    best_k: auto             # lowest mean cross-entropy, or integer in K range
    plot_k_min: 2
    plot_k_max: 20
    order_by: bestK          # bestK, clade, clade_then_bestK, input
    color_sample_labels_by_clade: true
    clade_color_strip: true
    width: 20
    height: 6
    multi_height: 18

# 7. COVERAGE — local coverage changes / candidate aneuploid regions ----------
coverage_plots:
  enabled: false             # true adds coverage screening to rule all
  bam_dir: null              # null = outdir/bam, including new and existing sorted BAMs
  window_bp: 10000           # fixed genomic windows; try 5000 for finer resolution
  mapq: 30
  exclude_flags: 3844        # unmapped, secondary, QC-fail, flagged duplicate, supplementary
  min_contig_bp: 10000
  exclude_contigs: []        # exact names, e.g. mitochondrial contigs
  baseline_contigs: []       # [] = all eligible contigs; otherwise known neutral contigs
  max_n_fraction: 0.10       # mask windows with excessive ambiguous reference bases
  gc_correct: true          # robust GC-bin median correction; raw depth is also retained
  gc_bins: 20
  min_gc_windows: 200        # skip correction if too few eligible positive-depth windows
  smooth_windows: 5         # centered median, within contiguous valid windows on each contig
  log2_threshold: 0.40       # candidate gain/loss threshold relative to sample baseline
  min_region_windows: 3      # consecutive windows beyond threshold; screening, not CNV calls
  pseudocount: 0.5           # permits plotting zero coverage without dropping those windows
  min_baseline_depth: 5      # QC flag for low-depth samples; still produces figures
  # Display only: these settings do not alter normalization or candidate regions.
  plot_min_contig_bp: null   # null = 50000 bp; 0 = show all analyzed sequences
  chromosomes_per_row: 16    # wrap into additional rows; each row has depth + log2 tracks
  outlier_quantiles: [0.01, 0.99] # robust y ranges; null = show the complete y range
  width: 18
  height: 8                 # height per row of sequences; total height grows with wrapping
  dpi: 200
